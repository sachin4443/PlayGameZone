<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayerX Ludo – offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0d1f; color: #f3f2ff; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      img { width: 84px; height: 84px; border-radius: 20px; }
      h1 { font-size: 22px; margin: 18px 0 6px; }
      p { color: #9b9bbd; margin: 0 0 20px; }
      button { border: 0; border-radius: 12px; background: #7c5cff; color: #fff; font-weight: 700; padding: 12px 22px; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>PlayerX Ludo needs an internet connection to play. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
